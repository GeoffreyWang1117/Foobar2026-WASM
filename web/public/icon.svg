<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- Waveform bars (retro equalizer style) -->
  <g fill="url(#waveGradient)" opacity="0.9">
    <rect x="80" y="220" width="24" height="72" rx="12"/>
    <rect x="120" y="180" width="24" height="152" rx="12"/>
    <rect x="160" y="140" width="24" height="232" rx="12"/>
    <rect x="200" y="200" width="24" height="112" rx="12"/>
    <rect x="240" y="160" width="24" height="192" rx="12"/>
    <rect x="280" y="190" width="24" height="132" rx="12"/>
    <rect x="320" y="150" width="24" height="212" rx="12"/>
    <rect x="360" y="200" width="24" height="112" rx="12"/>
    <rect x="400" y="230" width="24" height="52" rx="12"/>
  </g>

  <!-- Music note overlay -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="140" cy="360" r="28"/>
    <circle cx="200" cy="380" r="28"/>
    <rect x="165" y="280" width="12" height="100" rx="6"/>
    <rect x="225" y="300" width="12" height="100" rx="6"/>
    <path d="M 165 280 Q 165 260, 240 270 L 240 300 Q 240 285, 177 280 Z"/>
  </g>

  <!-- Sparkle effect -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="380" cy="120" r="6"/>
    <circle cx="420" cy="160" r="4"/>
    <circle cx="100" cy="140" r="5"/>
    <circle cx="440" cy="280" r="4"/>
  </g>
</svg>
